version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/data"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
